name: Docker Deploy

concurrency:
  group: docker-deploy-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      
      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Verify data integrity
        run: npm run verify:data

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E Test
        run: npm run test:e2e
      
      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
          
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test Docker runtime
        run: |
          IMAGE_TAG=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | tail -n 1)
          bash scripts/smoke-docker.sh "$IMAGE_TAG"

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          while IFS= read -r image_tag; do
            [ -n "$image_tag" ] || continue
            docker push "$image_tag"
          done <<< "${{ steps.meta.outputs.tags }}"

  # The production server pulls and deploys the published image itself
  # (scripts/server-deploy.sh via hamlog-deploy.timer); no job runs on it.
  # This job only reports when the public site serves the new commit.
  verify-release:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {}
    env:
      CONFIGURED_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}

    steps:
      - name: Wait for the server to deploy this commit
        run: |
          set -euo pipefail

          SITE_URL="${CONFIGURED_SITE_URL:-https://tech.hamwoo.co.kr}"
          SITE_URL="${SITE_URL%/}"
          EXPECTED_VERSION="${GITHUB_SHA::7}"

          for attempt in $(seq 1 70); do
            RESPONSE=$(curl -fsS --max-time 10 "$SITE_URL/api/health" 2>/dev/null || true)
            if [[ "$RESPONSE" == *'"status":"ok"'* ]] \
              && [[ "$RESPONSE" == *"\"version\":\"$EXPECTED_VERSION\""* ]]; then
              echo "Live: $RESPONSE"
              exit 0
            fi
            sleep 20
          done

          echo "The site did not report version $EXPECTED_VERSION within 23 minutes." >&2
          echo "Last response: ${RESPONSE:-none}" >&2
          echo "Check on the server: journalctl -u hamlog-deploy -n 100" >&2
          exit 1
