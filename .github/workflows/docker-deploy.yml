name: Docker Deploy

concurrency:
  group: docker-deploy-${{ github.ref }}
  # A newer push to the same PR replaces an older run; main releases never cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Runs repository and npm code, so it only gets a read-only token that is not
  # written to .git/config. Nothing in this job can publish an image.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Verify data integrity
        run: npm run verify:data

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E Test
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Builds the production image and smoke-tests it, still without registry access.
  # The build cache it writes lets the publish job reuse these exact layers.
  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: hamlog-smoke:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Docker runtime
        run: bash scripts/smoke-docker.sh "hamlog-smoke:${{ github.sha }}"

  # The only job that can write to GHCR. It runs no repository or npm code on the
  # runner: layers come from the image job's cache (a rebuild would run inside
  # BuildKit, which never sees the registry login), and actions are pinned to
  # commit SHAs so a moved tag cannot run with the write token.
  publish:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # The production server pulls and deploys the published image itself
  # (scripts/server-deploy.sh via hamlog-deploy.timer); no job runs on it.
  # This job only reports when the public site serves the new commit.
  verify-release:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {}
    env:
      CONFIGURED_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}

    steps:
      - name: Wait for the server to deploy this commit
        run: |
          set -euo pipefail

          SITE_URL="${CONFIGURED_SITE_URL:-https://tech.hamwoo.co.kr}"
          SITE_URL="${SITE_URL%/}"
          EXPECTED_VERSION="${GITHUB_SHA::7}"

          for attempt in $(seq 1 70); do
            RESPONSE=$(curl -fsS --max-time 10 "$SITE_URL/api/health" 2>/dev/null || true)
            if [[ "$RESPONSE" == *'"status":"ok"'* ]] \
              && [[ "$RESPONSE" == *"\"version\":\"$EXPECTED_VERSION\""* ]]; then
              echo "Live: $RESPONSE"
              exit 0
            fi
            sleep 20
          done

          echo "The site did not report version $EXPECTED_VERSION within 23 minutes." >&2
          echo "Last response: ${RESPONSE:-none}" >&2
          echo "Check on the server: journalctl -u hamlog-deploy -n 100" >&2
          exit 1
